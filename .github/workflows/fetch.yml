# Daily data update. Manual only for now; a daily schedule is added later, after the owner approves.
# Off switch: repository variable FETCH_ENABLED (anything but 'true' = nothing runs), or Disable this workflow.
name: fetch

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "試しだけ（データを保存しない）"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    if: vars.FETCH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      saved: ${{ steps.commit.outputs.saved }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Fetch
        env:
          FETCH_ENABLED: ${{ vars.FETCH_ENABLED }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: node pipeline/run.mjs $DRY
      - name: Commit data
        id: commit
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "no changes"; echo "saved=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "data: daily update"
          git push origin HEAD:main
          echo "saved=true" >> "$GITHUB_OUTPUT"

  # Pushes made with the built-in token do not start other workflows, so the site is deployed here.
  deploy:
    needs: fetch
    if: needs.fetch.outputs.saved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
